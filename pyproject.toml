[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whospoke"
version = "0.1.0"
description = "Who spoke what and when: separation, diarization and Hindi/Hinglish transcription for noisy multi-speaker audio (CS F407 project)."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: loads neural models / real data (deselect with -m 'not slow')"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
